<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Document</title>
    </head>
    <body>
        <div class="layout">
            <div class="library-container">
                <h1 id="library-title">My library</h1>
                <table id="bookshelves">
                    <tr>
                        <th>Id</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Read</th>
                        <th>Delete Entry</th>
                        <th>Change Status</th>
                    </tr>
                </table>
            </div>
            <div class="form-container">
                <form>
                    <div class="element">
                        <label for="title">Title:</label>
                        <input type="text" id="title" name="title" minlength="2" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s.]*$" required>
                    </div>
                    <div class="element">
                        <label for="author">Author:</label>
                        <input type="text" id="author" name="author" minlength="2" pattern="^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s.]*$" required>
                    </div>
                    <div class="element">
                        <label for="pages">Pages:</label>
                        <input type="text" id="pages" name="pages" pattern="^[0-9]*$" required>
                    </div>
                    <div class="element">
                        <label for="read">Read:</label>
                        <select name="read" id="read" required>
                            <option value="not read yet">Not read yet</option>
                            <option value="read">Read</option>
                        </select>
                    </div>
                <button type="submit">New Book</button>
                </form>
            </div>
        <script src="project-library.js"></script>
        </div>
    </body>
</html>
